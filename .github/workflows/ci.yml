name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # prisma.config.ts resolves the datasource url from DATABASE_URL via env().
    # generate never connects, so a dummy value is enough to satisfy the resolver.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # svelte-kit sync types $env/static/private from the env vars present at
      # build time. The example file lists every key, which is enough for type
      # generation (values are irrelevant here).
      - name: Set up environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check
